<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Unblocked Games</title>
    <style>
        body, html { margin: 0; padding: 0; width: 100%; height: 100%; overflow: hidden; background: #1a1a1a; font-family: sans-serif; }
        
        /* The Game Container */
        #gameContainer {
            position: fixed;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            z-index: 2147483647; /* Max Z-Index */
            display: none; /* Hidden until a game is loaded */
            background: #000;
        }

        #gameFrame {
            width: 100%;
            height: 100%;
            border: none;
        }

        /* The Input Interface */
        #interface {
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            height: 100%;
            color: white;
            text-align: center;
        }

        input {
            padding: 15px;
            width: 60%;
            font-size: 18px;
            border: 2px solid #444;
            background: #333;
            color: white;
            border-radius: 5px;
            margin-bottom: 10px;
        }

        button {
            padding: 15px 30px;
            font-size: 18px;
            background: #007bff;
            color: white;
            border: none;
            border-radius: 5px;
            cursor: pointer;
        }

        button:hover { background: #0056b3; }

        /* The "Close/Back" button that appears when a game is loaded */
        #backBtn {
            position: fixed;
            top: 10px;
            left: 10px;
            z-index: 2147483648;
            background: rgba(0,0,0,0.7);
            color: white;
            padding: 10px;
            border-radius: 50%;
            width: 40px;
            height: 40px;
            display: none;
            align-items: center;
            justify-content: center;
            font-weight: bold;
            cursor: pointer;
            border: 1px solid white;
        }
    </style>
</head>
<body>

    <!-- The Game Loader -->
    <div id="gameContainer">
        <iframe id="gameFrame" src=""></iframe>
    </div>

    <!-- The Input Interface -->
    <div id="interface">
        <h1>Unblocked Games</h1>
        <input type="text" id="gameUrl" placeholder="Paste game link here (e.g., https://...)" />
        <button onclick="loadGame()">Load Game</button>
        <p style="font-size: 12px; margin-top: 20px; color: #888;">Tip: Use sites like CoolMathGames, Hypergaming, or Proxy sites.</p>
    </div>

    <!-- The Back Button -->
    <div id="backBtn" onclick="closeGame()">X</div>

    <script>
        function loadGame() {
            let url = document.getElementById('gameUrl').value;
            if (!url) {
                alert("Please enter a URL first.");
                return;
            }
            
            // Ensure the URL has a protocol
            if (!url.startsWith('http://') && !url.startsWith('https://')) {
                url = 'https://' + url;
            }

            document.getElementById('gameFrame').src = url;
            document.getElementById('gameContainer').style.display = 'block';
            document.getElementById('interface').style.display = 'none';
            document.getElementById('backBtn').style.display = 'flex';
        }

        function closeGame() {
            document.getElementById('gameFrame').src = '';
            document.getElementById('gameContainer').style.display = 'none';
            document.getElementById('interface').style.display = 'flex';
            document.getElementById('backBtn').style.display = 'none';
        }
    </script>
</body>
</html>
